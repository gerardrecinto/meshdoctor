apiVersion: v1
kind: Namespace
metadata: {name: shop, labels: {istio-injection: enabled}}
---
apiVersion: v1
kind: Namespace
metadata: {name: legacy}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: shop}
spec: {selector: {app: checkout}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: client, namespace: shop}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: intruder, namespace: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-v1, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout, version: v1}}
  template:
    metadata: {labels: {app: checkout, version: v1}}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: checkout
          image: meshdoctor/checkout:dev
          imagePullPolicy: IfNotPresent
          env: [{name: VERSION, value: v1}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-v2, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout, version: v2}}
  template:
    metadata: {labels: {app: checkout, version: v2}}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: checkout
          image: meshdoctor/checkout:dev
          imagePullPolicy: IfNotPresent
          env: [{name: VERSION, value: v2}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata:
      labels: {app: client}
      annotations:
        proxy.istio.io/config: '{"proxyStatsMatcher": {"inclusionRegexps": [".*outlier_detection.*"]}}'
    spec:
      serviceAccountName: client
      containers:
        - {name: curl, image: "curlimages/curl:8.11.1", command: [sleep, "3600"], resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: intruder, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: intruder}}
  template:
    metadata: {labels: {app: intruder}}
    spec:
      serviceAccountName: intruder
      containers:
        - {name: curl, image: "curlimages/curl:8.11.1", command: [sleep, "3600"], resources: {requests: {cpu: 10m, memory: 16Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy-client, namespace: legacy}
spec:
  replicas: 1
  selector: {matchLabels: {app: legacy-client}}
  template:
    metadata:
      labels: {app: legacy-client, sidecar.istio.io/inject: "false"}
    spec:
      containers:
        - {name: curl, image: "curlimages/curl:8.11.1", command: [sleep, "3600"], resources: {requests: {cpu: 10m, memory: 16Mi}}}
