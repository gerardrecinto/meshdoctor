name: pages
on:
  push: {branches: [main], paths: [docs/**, cmd/**, internal/**, testdata/**, .github/workflows/pages.yml]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Build the browser linter
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o docs/meshdoctor.wasm ./cmd/wasm
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" docs/ 2>/dev/null || cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/
          cp testdata/bad.yaml docs/sample-bad.yaml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: d
        uses: actions/deploy-pages@v4
